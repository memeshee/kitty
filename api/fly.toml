# Kitty API on Fly. One machine, one volume, no external database: the index is
# rebuildable from the chain, which is the point of the product.
app = "kitty-api-memeshee"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_URL = "/data/kitty.db"
  NIMIQ_NETWORK = "mainnet"
  NIMIQ_RPC_URL = "https://rpc.nimiqwatch.com"
  ALLOWED_ORIGINS = "https://kitty-one-orpin.vercel.app"
  WEB_BASE_URL = "https://kitty-one-orpin.vercel.app/g"
  RUST_LOG = "kitty_api=info,tower_http=info"

[[mounts]]
  source = "kitty_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Kept warm on purpose: a judge who waits four seconds for a cold start is a
  # judge who has already formed an opinion. This is the cheapest machine size.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
