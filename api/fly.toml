# Kitty API on Fly. One machine, one volume, no external database: the index is
# rebuildable from the chain, which is the point of the product.
app = "kitty-api-memeshee"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_URL = "/data/kitty.db"
  NIMIQ_NETWORK = "mainnet"
  NIMIQ_RPC_URL = "https://rpc.nimiqwatch.com"
  ALLOWED_ORIGINS = "https://kitty-one-orpin.vercel.app"
  WEB_BASE_URL = "https://kitty-one-orpin.vercel.app/g"
  RUST_LOG = "kitty_api=info,tower_http=info"

[[mounts]]
  source = "kitty_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero. A jar nobody is looking at should not bill CPU, so the machine
  # leaves when the traffic does: `suspend` instead of `stop`, because a resume
  # restores the running process from a memory snapshot in a few hundred ms while
  # a stop has to boot the kernel, the binary and the migrations again.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # Autostop is decided on request concurrency, so say when a single machine is
  # considered busy rather than letting the default guess.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
