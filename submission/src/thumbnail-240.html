<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:240px;height:240px;overflow:hidden;background:#f4eee3}
  svg{display:block}
</style></head><body>
<!-- Kitty mark, drawn from web/app/icon.svg at 16x, full-bleed square:
     platforms apply their own corner mask, so the file itself must not. -->
<svg width="240" height="240" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" fill="#f4eee3"/>
  <g transform="translate(16 16) scale(0.86) translate(-16 -16)">
    <rect x="9" y="6.2" width="14" height="3.6" rx="1.8" fill="#14261f"/>
    <rect x="10.4" y="10.6" width="11.2" height="15.2" rx="3.6" fill="#14261f"/>
    <circle cx="16" cy="17.6" r="3.4" fill="#dd9a1e"/>
  </g>
</svg>
</body></html>
